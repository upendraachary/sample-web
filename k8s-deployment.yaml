apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-app-deployment
  labels:
    app: html-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: html-app
  template:
    metadata:
      labels:
        app: html-app
    spec:
      containers:
      - name: html-app-container
        image: upendraachary/simple-html-app:latest  # <-- Replace with your Docker Hub Username
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: html-app-service
spec:
  type: NodePort
  selector:
    app: html-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32000  # Exposes the application on port 32000 of your cluster nodes
